<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini-Xchange | Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand"><div class="logo">▲</div> Mini-Xchange</div>
    <p>A mini stock exchange. Trade fictional stocks with ₹1,00,000 of virtual cash, and watch your orders get matched live.</p>

    <div class="auth-tabs">
      <button type="button" id="tabLogin" class="active">Log in</button>
      <button type="button" id="tabRegister">Create account</button>
    </div>

    <form id="authForm">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="submitBtn">Log in</button>
      <div class="error" id="error"></div>
    </form>
  </div>

  <script>
    let mode = "login";
    const tabLogin = document.getElementById("tabLogin");
    const tabRegister = document.getElementById("tabRegister");
    const submitBtn = document.getElementById("submitBtn");
    const errorBox = document.getElementById("error");

    function setMode(m) {
      mode = m;
      tabLogin.classList.toggle("active", m === "login");
      tabRegister.classList.toggle("active", m === "register");
      submitBtn.textContent = m === "login" ? "Log in" : "Create account";
      errorBox.textContent = "";
    }
    tabLogin.onclick = () => setMode("login");
    tabRegister.onclick = () => setMode("register");

    document.getElementById("authForm").onsubmit = async (e) => {
      e.preventDefault();
      errorBox.textContent = "";
      const body = new URLSearchParams(new FormData(e.target));
      try {
        const res = await fetch("/api/" + mode, { method: "POST", body });
        const data = await res.json();
        if (!res.ok) { errorBox.textContent = data.error; return; }
        try {
          localStorage.setItem("minix_token", data.token);
          localStorage.setItem("minix_user", data.username);
        } catch (ignored) {}
        window.location.href = "/app.html";
      } catch (err) {
        errorBox.textContent = "Cannot reach the server. Is it running?";
      }
    };
  </script>
</body>
</html>
